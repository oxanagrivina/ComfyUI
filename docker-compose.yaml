services:
  comfyui:
    # Используем официальный проверенный образ, он скачается за 20 секунд
    image: 'pytorch/pytorch:2.1.2-cuda12.1-cudnn8-runtime'
    container_name: comfyui
    # Эта команда скачает ComfyUI и все ноды ПРИ ЗАПУСКЕ (из вольюмов)
    command: >
      bash -c "pip install --no-cache-dir GitPython toml matplotlib rich scikit-image opencv-python-headless onnxruntime 
      && python main.py --listen 0.0.0.0 --cpu"
    ports:
      - "8188:8188"
    volumes:
      - /data/coolify/applications/w4ksocso4kc4g4k8wwgw884w/models:/app/models
      - /data/coolify/applications/w4ksocso4kc4g4k8wwgw884w/custom_nodes:/app/custom_nodes
      - /data/coolify/applications/w4ksocso4kc4g4k8wwgw884w/input:/app/input
      - /data/coolify/applications/w4ksocso4kc4g4k8wwgw884w/output:/app/output
      - /data/coolify/applications/w4ksocso4kc4g4k8wwgw884w/user:/app/user
      # Мы монтируем корень приложения, чтобы ComfyUI был на месте
      - /data/coolify/applications/w4ksocso4kc4g4k8wwgw884w/comfy_core:/app
    working_dir: /app
    environment:
      - CUDA_VISIBLE_DEVICES=-1
    restart: always
